name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements-tested.txt -e '.[dev]'
      - run: python -m pytest -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: courtsignal
          POSTGRES_PASSWORD: courtsignal
          POSTGRES_DB: courtsignal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U courtsignal -d courtsignal_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-tested.txt -e '.[postgres,dev]'
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://courtsignal:courtsignal@localhost:5432/courtsignal_test
