services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: courtsignal
      POSTGRES_PASSWORD: courtsignal
      POSTGRES_DB: courtsignal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - courtsignal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtsignal"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  courtsignal_postgres:
