[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "courtsignal"
version = "0.1.0"
description = "Court-record ingestion, provenance, grounded extraction, and search"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "pypdf>=5,<7", "httpx[socks]>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10"]

[project.scripts]
courtsignal = "courtsignal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
courtsignal = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
